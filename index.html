<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ekans — Pokémon Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =============================================
       THEME TOGGLE
       Fixed button — always visible on all screens
  ============================================= -->
  <button id="btn-theme" class="theme-toggle" aria-label="Toggle light/dark mode">
    <span class="toggle-icon">☀️</span>
    <span class="toggle-label"> LIGHT</span>
  </button>

  <!-- =============================================
       MAIN MENU SCREEN
  ============================================= -->
  <div id="screen-menu" class="screen active">
    <div class="panel">
      <div class="pokemon-logo">POKÉMON</div>
      <h1 class="game-title">SNAKE GAME</h1>
      <p class="game-subtitle">Snake Edition</p>

      <div class="ekans-art" aria-label="Ekans illustration">
        <img id="gif" class="gif" />
        <p class="dex-entry" id="dex-entry">
      </div>

      <div class="difficulty-selector">
        <p class="label">SELECT DIFFICULTY</p>
        <div class="difficulty-buttons">
          <button class="diff-btn active" data-speed="120" id="diff-easy">EASY</button>
          <button class="diff-btn" data-speed="80" id="diff-normal">NORMAL</button>
          <button class="diff-btn" data-speed="50" id="diff-hard">HARD</button>
        </div>
      </div>

      <button id="btn-start" class="btn-primary">▶ START GAME</button>
      <p class="controls-hint">Arrow Keys / WASD to move &nbsp;|&nbsp; P to pause</p>
    </div>
  </div>

  <!-- =============================================
       GAME SCREEN
  ============================================= -->
  <div id="screen-game" class="screen">
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="hud-score" class="hud-value">0</span>
      </div>
      <div class="hud-item hud-center">
        <span class="hud-label">POKEMON</span>
      </div>
      <div class="hud-item hud-right">
        <span class="hud-label">LEVEL</span>
        <span id="hud-level" class="hud-value">1</span>
      </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="overlay-pause" class="overlay hidden">
      <div class="panel compact">
        <h2>⏸ PAUSED</h2>
        <p>Press <strong>P</strong> to resume</p>
        <button id="btn-resume" class="btn-primary">RESUME</button>
        <button id="btn-quit-pause" class="btn-secondary">QUIT TO MENU</button>
      </div>
    </div>
  </div>

  <!-- =============================================
       GAME OVER SCREEN
  ============================================= -->
  <div id="screen-gameover" class="screen">
    <div class="panel">
      <div class="fainted-text">YOUR POKEMON<br/>FAINTED!</div>

      <div class="final-stats">
        <div class="stat-row">
          <span>SCORE</span>
          <span id="final-score">0</span>
        </div>
        <div class="stat-row">
          <span>HIGH SCORE</span>
          <span id="final-highscore">0</span>
        </div>
        <div class="stat-row">
          <span>LEVEL REACHED</span>
          <span id="final-level">1</span>
        </div>
        <div class="stat-row">
          <span>BERRIES ATE</span>
          <span id="final-berries">0</span>
        </div>
      </div>
      <button id="btn-retry" class="btn-primary">▶ TRY AGAIN</button>
      <button id="btn-menu" class="btn-secondary">MAIN MENU</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
